<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SIGMA-P – Commute guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z" />
        </symbol>
        <symbol id="i-hist" viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2" />
        </symbol>
        <symbol id="i-gear" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <circle cx="12" cy="12" r="8" stroke-dasharray="3.4 2.4" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="M16.5 16.5L21 21" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="M15 5l-7 7 7 7" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24">
          <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" />
          <circle cx="12" cy="10" r="2.5" />
        </symbol>
        <symbol id="i-seat" viewBox="0 0 24 24">
          <path d="M8 3v10h9l2 7M8 17h6" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-coin" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M9 7.5h4.5a2.5 2.5 0 0 1 0 5H9M9 7.5v9M7.5 10.5h7" />
        </symbol>
        <symbol id="i-bus" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="13" rx="3" />
          <path d="M3 11h18" />
          <circle cx="7.5" cy="19.5" r="1.2" />
          <circle cx="16.5" cy="19.5" r="1.2" />
        </symbol>
        <symbol id="i-user-fill" viewBox="0 0 24 24">
          <circle cx="12" cy="8.5" r="4.6" />
          <path d="M2.5 24c0-6 4.5-8.5 9.5-8.5s9.5 2.5 9.5 8.5z" />
        </symbol>
        <g id="m">
          <rect class="mb" width="400" height="600" />
          <rect class="mp" x="215" y="150" width="80" height="70" rx="10" />
          <rect class="mp" x="40" y="380" width="70" height="60" rx="10" />
          <g class="mr">
            <path
              stroke-width="10"
              d="M-10 120L410 60M-10 330L410 270M-10 520L410 470"
            />
            <path
              stroke-width="12"
              d="M60-10L120 610M200-10L170 610M320-10L380 610"
            />
            <path
              stroke-width="5"
              d="M-10 220L410 190M-10 430L410 400M260-10L300 610M130-10L90 610"
            />
          </g>
        </g>
      </defs>
    </svg>

    <div class="app" data-v="home">
      <nav class="tabs" aria-label="Main">
        <div class="logo">SIGMA-P</div>
        <a href="#home" data-nav="home"
          ><svg class="i"><use href="#i-home" /></svg><span>Home</span></a
        >
        <a href="#location" data-nav="location"
          ><svg class="i"><use href="#i-pin" /></svg><span>Plan</span></a
        >
        <a href="#route" data-nav="route"
          ><svg class="i"><use href="#i-hist" /></svg><span>Trips</span></a
        >
        <button type="button" disabled aria-label="Settings">
          <svg class="i"><use href="#i-gear" /></svg><span>Settings</span>
        </button>
        <button type="button" disabled aria-label="Profile">
          <svg class="i"><use href="#i-user" /></svg><span>Profile</span>
        </button>
      </nav>

      <main style="display: contents">
        <!-- HOME -->
        <section id="home" class="view" aria-label="Home">
          <header class="head">
            <div class="who">
              <div class="av">
                <svg class="i"><use href="#i-user-fill" /></svg>
              </div>
              <div>
                <h1>SIGMA-P</h1>
                <p>Where you going next?</p>
              </div>
            </div>
            <label class="search"
              ><input
                id="q"
                type="search"
                placeholder="Search a place"
                aria-label="Search a place" /><svg class="i">
                <use href="#i-search" /></svg
            ></label>
          </header>
          <div class="list" id="list"></div>
        </section>

        <!-- LOCATION -->
        <section id="location" class="view" aria-label="Choose priority">
          <svg
            class="map"
            viewBox="0 0 400 600"
            preserveAspectRatio="xMidYMid slice"
            aria-hidden="true"
          >
            <use href="#m" />
          </svg>
          <div class="gmap" id="gm-loc"></div>
          <button class="back" data-go="home" aria-label="Back">
            <svg class="i"><use href="#i-back" /></svg>
          </button>
          <div class="sheet">
            <h2>Choose Priority</h2>
            <div class="pri" id="pri">
              <button type="button" aria-pressed="false">
                <svg class="i"><use href="#i-seat" /></svg>Comfort
              </button>
              <button type="button" aria-pressed="true">
                <svg class="i"><use href="#i-clock" /></svg>Time
              </button>
              <button type="button" aria-pressed="false">
                <svg class="i"><use href="#i-coin" /></svg>Budget
              </button>
            </div>
            <h3>Travel Details:</h3>
            <label class="fld"
              ><svg class="i"><use href="#i-pin" /></svg>From:<input
                id="from"
                list="places"
                autocomplete="off"
                placeholder="Dasmariñas City Hall"
            /></label>
            <label class="fld to"
              ><svg class="i"><use href="#i-pin" /></svg>To:<input
                id="to"
                list="places"
                autocomplete="off"
                placeholder="DLSU Dasma, 4103"
            /></label>
            <p id="err" class="err" role="alert" hidden></p>
            <button class="btn" data-go="route">Search</button>
            <datalist id="places"></datalist>
          </div>
        </section>

        <!-- ROUTE -->
        <section id="route" class="view" aria-label="Route details">
          <header class="rh">
            <div class="rt">
              <button class="back" data-go="location" aria-label="Back">
                <svg class="i"><use href="#i-back" /></svg>
              </button>
              <h1>Route Details</h1>
              <span></span>
            </div>
            <div class="info">
              <div>
                <small>(Location)</small><b id="rf">Dasmariñas City Hall</b>
              </div>
              <div>
                <small>(Destination)</small
                ><b id="rd">De La Salle Dasmariñas Gate 1</b>
              </div>
            </div>
          </header>
          <div class="rmap">
            <svg
              class="map"
              viewBox="0 0 400 600"
              preserveAspectRatio="xMidYMid slice"
              aria-hidden="true"
            >
              <use href="#m" />
              <g id="rg"></g>
            </svg>
            <div class="gmap" id="gm-route"></div>
            <div class="chips" id="chips"></div>
          </div>
          <div class="sheet">
            <div id="legs"></div>
            <button class="custom" type="button">Add custom stops?</button>
            <p class="fare">(Student Fare)</p>
            <div class="tot"><span>Total Time:</span><span id="tt"></span></div>
            <div class="tot"><span>Total Fare:</span><span id="tf"></span></div>
            <div class="tot">
              <span>Total Distance:</span><span id="td"></span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <script src="vendor/leaflet/leaflet.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
